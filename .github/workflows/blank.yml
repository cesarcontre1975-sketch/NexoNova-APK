
name: Construir APK NexoNova

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Comprobar y extraer proyecto
        run: |
          ls -la
          if [ ! -f Proyecto_APK_NexoNova.zip ]; then
            echo "No se encontro el archivo ZIP"
            exit 1
          fi
          mkdir -p proyecto
          unzip -o Proyecto_APK_NexoNova.zip -d proyecto
          find proyecto -maxdepth 4 -name gradlew -type f

      - name: Compilar APK
        run: |
          GRADLEW="$(find proyecto -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "No se encontro gradlew dentro del ZIP"
            find proyecto -maxdepth 5 -type f
            exit 1
          fi
          DIR="$(dirname "$GRADLEW")"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NexoNova-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
