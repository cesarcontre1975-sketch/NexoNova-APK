name: Construir APK NexoNova

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer proyecto
        run: |
          test -f Proyecto_APK_NexoNova.zip
          mkdir proyecto
          unzip -q Proyecto_APK_NexoNova.zip -d proyecto

      - name: Compilar APK
        run: |
          GRADLEW="$(find proyecto -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew dentro del ZIP"
            find proyecto -maxdepth 3 -type f
            exit 1
          fi
          DIR="$(dirname "$GRADLEW")"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NexoNova-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
