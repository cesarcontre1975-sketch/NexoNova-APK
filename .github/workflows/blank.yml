
name: Construir APK NexoNova

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Comprobar y extraer proyecto
        run: |
          set -eu
          test -f NexoNova_APK_Project.zip
          mkdir -p proyecto
          unzip -oq NexoNova_APK_Project.zip -d proyecto
          echo "Contenido del proyecto:"
          find proyecto -maxdepth 4 -type f | head -80
          GRADLEW="$(find proyecto -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew. Se intentará usar Gradle instalado."
          fi

      - name: Compilar APK
        run: |
          set -eu
          GRADLEW="$(find proyecto -type f -name gradlew -print -quit)"
          if [ -n "$GRADLEW" ]; then
            DIR="$(dirname "$GRADLEW")"
            cd "$DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "El proyecto no incluye gradlew. No se puede compilar todavía."
            exit 1
          fi

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexoNova-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
